syntax = "proto3";

option go_package = "Distributed-Auction-System/proto";

// A bid to be placed by clients, sent to an auction-node
message ProposedBid {
    int32 bidding_client_id = 1;
    int32 bid_amount = 2;
}

// Acknowledgement returned to a bidder: either the bid succeeds or fails.
// If the auction is over, the acknowledgement type is "Exception"
message Acknowledgement {
    enum AckType {
        EXCEPTION = 0;
        FAIL = 1;
        SUCCESS = 2;
    }

    AckType ackType = 1;
}

// The result of an auction: only to be returned once the auction has finished
message Result {
    int32 highest_bidder_id = 1;
    int32 highest_bid_final = 2;
}

// An outcome: if the auction is still alive, returns highest bid so far,
// otherwise returns the Result, including bidder and the final highest bid
message Outcome {
    oneof OutcomeType {
        int32 highest_bid_so_far = 1;
        Result result = 2;
    }
}

// A Result request: contains the requesting client's ID so it may be logged
message ResultRequest {
    int32 requesting_client_id = 1;
}

// Auction-node service. Clients may RPC-call bidding (TryBid),
// as well as query the state of the auction (TryResult)
service AuctionNode {
    rpc Bid(ProposedBid) returns (Acknowledgement);
    rpc Result(ResultRequest) returns (Outcome);
}
